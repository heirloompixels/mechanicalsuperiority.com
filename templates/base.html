<!DOCTYPE html>
<html lang="{{ config.default_language }}">
<head>
    {% include "head.html" %}
</head>
<body>
    <a class="skip-link" href="#main">Skip to content</a>

    <header class="site-header">
        <div class="bar">
            <a class="brand" href="{{ get_url(path='/', trailing_slash=true) | safe }}">
                <img src="{{ get_url(path='logo.png', trailing_slash=false) | safe }}"
                     alt="{{ config.title }}" width="1196" height="264" />
            </a>
            <nav class="site-nav" aria-label="Primary">
                <a href="{{ get_url(path='/services/', trailing_slash=true) | safe }}">Services</a>
                <a href="{{ get_url(path='/writing/', trailing_slash=true) | safe }}">Writing</a>
                <a href="{{ get_url(path='/about/', trailing_slash=true) | safe }}">About</a>
                <a href="{{ get_url(path='/contact/', trailing_slash=true) | safe }}">Contact</a>
            </nav>
        </div>
    </header>

    <main id="main">
        {% block content %}{% endblock content %}
    </main>

    <footer class="site-footer">
        <div class="wrap footer-inner">
            <p class="footer-name">{{ config.extra.legal_name }}</p>
            <p class="footer-line">{{ config.extra.locality }}</p>
            <p class="footer-line">
                <a href="mailto:{{ config.extra.email }}">{{ config.extra.email }}</a>
            </p>
            <p class="footer-line subtle">Design · Machining · Welding · Plasma Cutting · Sheet Metal</p>
        </div>
    </footer>
</body>
</html>

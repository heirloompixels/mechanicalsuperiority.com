{% extends "base.html" %}

{% block content %}
{% set ctx = page | default(value=section) %}
<section class="page-hero">
  <div class="wrap">
    <h1>{{ ctx.title }}</h1>
    {% if ctx.description %}<p class="page-intro">{{ ctx.description }}</p>{% endif %}
  </div>
</section>

<article class="wrap prose">
  {{ ctx.content | safe }}
</article>
{% endblock content %}

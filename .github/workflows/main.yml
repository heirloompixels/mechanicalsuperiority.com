# On every push this script is executed
on: push
name: Build and deploy GH Pages
jobs:
  build:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    # The deploy step pushes the built site to PAGES_BRANCH in this repo.
    permissions:
      contents: write
    steps:
      - name: checkout
        uses: actions/checkout@v4
      # llms-full.txt is made from the built site (much of the text lives in
      # the templates), so build once without deploying, write it into
      # static/, and let the deploy build again with it. If the script fails
      # the site still deploys, only without llms-full.txt.
      - name: build_for_llms_full
        uses: shalzz/zola-deploy-action@v0.22.1
        env:
          BUILD_ONLY: true
      - name: llms_full
        continue-on-error: true
        run: python3 bin/llms-full.py public static/llms-full.txt
      - name: build_and_deploy
        uses: shalzz/zola-deploy-action@v0.22.1
        env:
          # Target branch
          PAGES_BRANCH: gh-pages
          # Publishing to this same repo, so the automatic per-run token is
          # enough — no personal access token to mint, rotate, or have expire.
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Or if publishing to the same repo, use the automatic token
          #TOKEN: ${{ secrets.GITHUB_TOKEN }}

# The domain moved here from Ghost on 2026-10-08. static/CNAME must say the
# same domain, or the next deploy drops it. See README.md § the domain.
base_url = "https://mechanicalsuperiority.com"
title = "Mechanical Superiority"
description = "CAD design, reverse engineering of obsolete parts, and aluminum and stainless fabrication, from Mark's shop near Fort Collins, Colorado."
compile_sass = false
minify_html = false
default_language = "en"
generate_feeds = true
feed_filenames = ["rss.xml"]

taxonomies = [
  { name = "tags", feed = false, paginate_by = 0 },
]

[slugify]
paths = "on"
anchors = "on"

[markdown]
render_emoji = false
external_links_target_blank = true
smart_punctuation = true

[link_checker]
internal_level = "warn"


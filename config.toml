# Base URL is the GitHub Pages project URL until mechanicalsuperiority.com is
# pointed here. When the domain moves: set this to https://mechanicalsuperiority.com,
# add static/CNAME with the bare domain in it, and set the custom domain in
# Settings -> Pages. See README.md § moving the domain.
base_url = "https://heirloompixels.github.io/mechanicalsuperiority.com"
title = "Mechanical Superiority"
description = "CAD design, reverse engineering of obsolete parts, and aluminum and stainless fabrication, from Mark's shop near Fort Collins, Colorado."
compile_sass = false
minify_html = false
default_language = "en"
generate_feeds = true
feed_filenames = ["rss.xml"]

taxonomies = [
  { name = "tags", feed = false, paginate_by = 0 },
]

[slugify]
paths = "on"
anchors = "on"

[markdown]
render_emoji = false
external_links_target_blank = true
smart_punctuation = true

[link_checker]
internal_level = "warn"

[extra]
# Exactly as filed with the Colorado Secretary of State, comma included.
# SAM.gov rejects any variation.
legal_name = "Mechanical Superiority, LLC"
locality = "Fort Collins, Colorado"
email = "mechanicalsuperiority@gmail.com"
cad = "SolidWorks"
# phone = ""   # Mark is getting a Google Voice number — see TODO.md
# The street address stays off the site by Mark's choice (2026-09-28).
# intro_video = "video/intro.mp4"   # Mark is making one; see TODO.md

build_search_index = false
